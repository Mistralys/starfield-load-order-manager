name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build "Starfield Load Order Keeper.sln" --configuration Release

      - name: Run unit tests
        run: dotnet test "Tests/LoadOrderKeeper.Tests/LoadOrderKeeper.Tests.csproj" --configuration Release --no-build
