name: Release Build

# To ensure that the integration is allowed to create releases
permissions:
  contents: write

on:
  push:
    tags:
      - '[0-9]*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # Required to detect previous tag

      - name: Install .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: |
          dotnet test "Tests/LoadOrderKeeper.Tests/LoadOrderKeeper.Tests.csproj" `
            --configuration Release `
            --logger "trx;LogFileName=test-results.trx" `
            --logger "console;verbosity=detailed"
        
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Install WiX Toolset
        run: choco upgrade wixtoolset -y

      - name: Setup MSBuild 
        uses: microsoft/setup-msbuild@v2

      - name: Extract version from tag
        id: version
        run: |
          $tag = "${{ github.ref_name }}"
          $pattern = '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)(?:-(?<pre>[0-9A-Za-z.-]+))?$'
          $match = [regex]::Match($tag, $pattern)
          if (-not $match.Success) {
            throw "Tag '$tag' does not follow the expected semantic versioning pattern."
          }

          # Derive an MSI-safe fourth segment and keep prereleases lower than finals.
          $build = 0
          if ($match.Groups['pre'].Success) {
            $digits = [regex]::Match($match.Groups['pre'].Value, '\d+').Value
            if ([string]::IsNullOrEmpty($digits)) {
              $build = 1
            } else {
              $build = [int]$digits
            }

            if ($build -gt 65535) {
              $build = 65535
            }
          }

          $version = '{0}.{1}.{2}.{3}' -f $match.Groups['major'].Value, $match.Groups['minor'].Value, $match.Groups['patch'].Value, $build

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Determine previous tag
        id: prev
        run: |
          $current = "${{ github.ref_name }}"
          $tags = git tag --sort=-v:refname
          $previous = $tags | Where-Object { $_ -ne $current } | Select-Object -First 1
          if (-not $previous) { $previous = "N/A" }
          echo "previous=$previous" >> $env:GITHUB_OUTPUT

      - name: Extract changelog entry
        id: changelog
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $content = Get-Content changelog.md

          # Find the line number of the current version header
          $start = ($content | Select-String -Pattern "^## v$tag\b").LineNumber
          if (-not $start) {
            echo "entry=No changelog entry found." >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Find the next version header
          $next = ($content | Select-String -Pattern "^## " | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if (-not $next) {
            $next = $content.Length + 1
          }

          # Extract the lines for this version (skip the header line)
          $entryLines = $content[$start..($next - 2)]
          
          # Remove empty lines and join
          $entry = ($entryLines | Where-Object { $_.Trim() -ne "" }) -join "`n"

          # Use multiline output to avoid escaping issues entirely
          $delimiter = "EOF_CHANGELOG_$(Get-Random)"
          echo "entry<<$delimiter" >> $env:GITHUB_OUTPUT
          echo $entry >> $env:GITHUB_OUTPUT
          echo $delimiter >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $prev = "${{ steps.prev.outputs.previous }}"
          $repo = "${{ github.repository }}"
          $notesPath = "RELEASE_NOTES.txt"

          "Included in this release:" | Out-File -FilePath $notesPath -Encoding utf8
          "" | Out-File -FilePath $notesPath -Encoding utf8 -Append
          
          # Use here-string to avoid variable parsing issues
          @'
          ${{ steps.changelog.outputs.entry }}
          '@ | Out-File -FilePath $notesPath -Encoding utf8 -Append

          if ($prev -ne "N/A") {
            "" | Out-File -FilePath $notesPath -Encoding utf8 -Append
            "----" | Out-File -FilePath $notesPath -Encoding utf8 -Append
            "[Changes since $prev](https://github.com/$repo/compare/$prev...$tag)" | Out-File -FilePath $notesPath -Encoding utf8 -Append
            "" | Out-File -FilePath $notesPath -Encoding utf8 -Append
          }

      - name: Publish WPF application
        run: |
          dotnet publish "Starfield Load Order Keeper.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o installer/publish `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:AssemblyVersion=${{ steps.version.outputs.version }} `
            -p:FileVersion=${{ steps.version.outputs.version }} `
            -p:InformationalVersion=${{ steps.version.outputs.tag }}

      - name: Build MSI installer
        run: |
          cd installer
          msbuild StarfieldLoadOrderKeeper.wixproj `
            /p:ProductVersion=${{ steps.version.outputs.version }} `
            /p:PublishDir=publish `
            /p:Configuration=Release `
            /p:Platform=x64

      - name: Rename MSI installer with version
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          $sourcePath = "installer/bin/Release/StarfieldLoadOrderKeeper.msi"
          $targetPath = "installer/bin/Release/StarfieldLoadOrderKeeper-$version.msi"
          Move-Item -Path $sourcePath -Destination $targetPath -Force
          echo "MSI renamed to: StarfieldLoadOrderKeeper-$version.msi"

      - name: Create ZIP package
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path installer/publish/* -DestinationPath "StarfieldLoadOrderKeeper-$version.zip"
          echo "ZIP created: StarfieldLoadOrderKeeper-$version.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            installer/bin/Release/StarfieldLoadOrderKeeper-${{ steps.version.outputs.tag }}.msi
            StarfieldLoadOrderKeeper-${{ steps.version.outputs.tag }}.zip
