name: Release Build

# To ensure that the integration is allowed to create releases
permissions:
  contents: write

on:
  push:
    tags:
      - '[0-9]*'
  # Manual run (Actions tab or `gh workflow run release.yml --ref <branch>`): builds and tests
  # everything and uploads the MSI and ZIP as workflow artifacts, but never creates a release.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Required to detect previous tag

      - name: Install .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run unit tests
        run: |
          dotnet test "Tests/LoadOrderKeeper.Tests/LoadOrderKeeper.Tests.csproj" `
            --configuration Release `
            --logger "trx;LogFileName=test-results.trx" `
            --logger "console;verbosity=detailed"
        
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: true

      - name: Install WiX Toolset
        run: choco upgrade wixtoolset -y

      - name: Extract version from tag
        id: version
        run: |
          # The tag is validated against the semantic versioning pattern by Tools/BuildMsi.ps1.
          # A manual run has no tag (ref_name is a branch), so it uses the csproj <Version> instead.
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = (Select-String -Path "Starfield Load Order Keeper.csproj" -Pattern '<Version>\s*([^<\s]+)\s*</Version>' | Select-Object -First 1).Matches[0].Groups[1].Value
          } else {
            $tag = "${{ github.ref_name }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Determine previous tag
        id: prev
        run: |
          $current = "${{ github.ref_name }}"
          $tags = git tag --sort=-v:refname
          $previous = $tags | Where-Object { $_ -ne $current } | Select-Object -First 1
          if (-not $previous) { $previous = "N/A" }
          echo "previous=$previous" >> $env:GITHUB_OUTPUT

      - name: Extract changelog entry
        id: changelog
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $content = Get-Content changelog.md

          # Find the line number of the current version header
          $start = ($content | Select-String -Pattern "^## v$tag\b").LineNumber
          if (-not $start) {
            echo "entry=No changelog entry found." >> $env:GITHUB_OUTPUT
            echo "title=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Extract the title from the version header (e.g., "## v1.7.1 - Invalid Config Handling")
          $headerLine = $content[$start - 1]
          $titleMatch = [regex]::Match($headerLine, "^## v$tag\s*-\s*(.+)$")
          if ($titleMatch.Success) {
            $title = $titleMatch.Groups[1].Value.Trim()
            echo "title=$title" >> $env:GITHUB_OUTPUT
          } else {
            echo "title=" >> $env:GITHUB_OUTPUT
          }

          # Find the next version header
          $next = ($content | Select-String -Pattern "^## " | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if (-not $next) {
            $next = $content.Length + 1
          }

          # Extract the lines for this version (skip the header line)
          $entryLines = $content[$start..($next - 2)]
          
          # Remove empty lines and join
          $entry = ($entryLines | Where-Object { $_.Trim() -ne "" }) -join "`n"

          # Use multiline output to avoid escaping issues entirely
          $delimiter = "EOF_CHANGELOG_$(Get-Random)"
          echo "entry<<$delimiter" >> $env:GITHUB_OUTPUT
          echo $entry >> $env:GITHUB_OUTPUT
          echo $delimiter >> $env:GITHUB_OUTPUT

      - name: Prepare release notes
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $prev = "${{ steps.prev.outputs.previous }}"
          $repo = "${{ github.repository }}"
          $notesPath = "RELEASE_NOTES.txt"

          "Included in this release:" | Out-File -FilePath $notesPath -Encoding utf8
          "" | Out-File -FilePath $notesPath -Encoding utf8 -Append
          
          # Use here-string to avoid variable parsing issues
          @'
          ${{ steps.changelog.outputs.entry }}
          '@ | Out-File -FilePath $notesPath -Encoding utf8 -Append

          if ($prev -ne "N/A") {
            "" | Out-File -FilePath $notesPath -Encoding utf8 -Append
            "----" | Out-File -FilePath $notesPath -Encoding utf8 -Append
            "[Changes since $prev](https://github.com/$repo/compare/$prev...$tag)" | Out-File -FilePath $notesPath -Encoding utf8 -Append
            "" | Out-File -FilePath $notesPath -Encoding utf8 -Append
          }

          # Download hints always close the release text
          @'
          ----

          ## Download hints:

          - Use the `.msi` if you prefer an official installer with uninstall functionality.
          - Use the `.zip` if you prefer a portable install. Extract & start from the folder.

          > NOTE: The MSI is not signed (signing is expensive). Use the hashes to verify your downloaded file to guarantee that it's valid.
          '@ | Out-File -FilePath $notesPath -Encoding utf8 -Append

      - name: Build MSI installer
        # Publishes the app into installer/publish and builds
        # installer/bin/Release/StarfieldLoadOrderKeeper-<tag>.msi. The same script runs locally.
        run: ./Tools/BuildMsi.ps1 -Version "${{ steps.version.outputs.tag }}"

      - name: Create ZIP package
        run: |
          $version = "${{ steps.version.outputs.tag }}"
          Compress-Archive -Path installer/publish/* -DestinationPath "StarfieldLoadOrderKeeper-$version.zip"
          echo "ZIP created: StarfieldLoadOrderKeeper-$version.zip"

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: StarfieldLoadOrderKeeper-${{ steps.version.outputs.tag }}
          path: |
            installer/bin/Release/StarfieldLoadOrderKeeper-${{ steps.version.outputs.tag }}.msi
            StarfieldLoadOrderKeeper-${{ steps.version.outputs.tag }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}${{ steps.changelog.outputs.title && format(' - {0}', steps.changelog.outputs.title) || '' }}
          body_path: RELEASE_NOTES.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            installer/bin/Release/StarfieldLoadOrderKeeper-${{ steps.version.outputs.tag }}.msi
            StarfieldLoadOrderKeeper-${{ steps.version.outputs.tag }}.zip